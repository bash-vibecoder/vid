plugins { id 'com.android.application' }

android {
    namespace 'com.apocketvid.player'
    compileSdk 36
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId project.hasProperty('validationBuild') ? 'com.apocketvid.validation' : 'com.apocketvid.player'
        testInstrumentationRunner 'com.apocketvid.player.StartupSmokeInstrumentation'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '1.4.5'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
            excludes += ['**/libffmpeg_mediametadataretriever_jni.so']
        }
    }

    signingConfigs {
        debug {
            if (rootProject.file('.local/pocket-video-debug.jks').exists()) {
                storeFile rootProject.file('.local/pocket-video-debug.jks')
                storePassword 'android'
                keyAlias 'pocketvideo'
                keyPassword 'android'
            }
        }
    }
}

dependencies {
    implementation 'org.videolan.android:libvlc-all:3.7.7'
    runtimeOnly('com.github.wseemann:FFmpegMediaMetadataRetriever-native:1.0.23') { transitive = false }
    testImplementation 'junit:junit:4.13.2'
}
